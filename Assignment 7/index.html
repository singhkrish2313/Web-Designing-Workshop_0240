<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navigation Menu Using Lists</title>
    <style>
        /* Remove default bullet points and spacing */
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            background-color: #2b2e2b; /* Dark charcoal background */
            overflow: hidden;
        }

        /* Align list items side-by-side horizontally */
        li {
            float: left;
        }

        /* Style the navigation links */
        li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            font-family: Georgia, serif;
            font-size: 16px;
        }

        /* Optional: Add a subtle hover effect */
        li a:hover {
            background-color: #111111;
        }
    </style>
</head>
<body>

    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#courses">Courses</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>

</body>
</html>
