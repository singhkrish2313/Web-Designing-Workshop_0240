<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Links Demo</title>
</head>
<body>

    <p>Links demo</p>

    <!-- 1. External Link -->
    <a href="https://example.com" target="_blank" title="Visit Example Website">External link</a><br>

    <!-- 2. Internal Link (Page Bookmark) -->
    <a href="#bottom" title="Scroll down to the bottom">Jump to bottom</a><br>

    <!-- 3. Email Link -->
    <a href="mailto:someone@://example.com" title="Send us an email">Email us</a><br>

    <!-- 4. Image Link with Attributes -->
    <a href="https://example.com" target="_blank">
        <img src="images.jpg" alt="Logo" width="120" height="100" border="1">
    </a>

    <!-- Spacer to test the internal link -->
    <div style="height: 800px;"></div>

    <!-- Target destination for "Jump to bottom" -->
    <p id="bottom">You have reached the bottom of the page.</p>

</body>
</html>
