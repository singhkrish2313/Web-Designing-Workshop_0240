<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accessible Page</title>
</head>
<body>
    <!-- 1. Skip Link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- 2. Navigation / Links -->
    <nav aria-label="Primary Navigation">
        <a href="#home">Home</a>
        <a href="#help">Help</a>
    </nav>

    <main id="main-content">
        <!-- 3. Proper Heading -->
        <h1>Accessible Page</h1>

        <!-- 4. Input with ARIA label or associated label -->
        <div>
            <label for="custom-input">Input field:</label>
            <input type="text" id="custom-input" aria-label="Custom text input">
            <button aria-label="Clear input">X</button>
        </div>

        <!-- 5. Search field with proper label and alt text/ARIA -->
        <div style="margin-top: 10px;">
            <label for="search-input">Search:</label>
            <input type="search" id="search-input" name="q" placeholder="Search...">
        </div>
    </main>
</body>
</html>
